{% extends "base.html" %}
{% block title %}Editar Categoria{% endblock %}

{% block content %}
<h1>Cadastro de Categorias de Café</h1>
<h2>Alterar/Editar Categoria</h2>

<form method="POST">
    <input type="text" name="nome" value="{{ categoria[1] }}" required>
    <br>
    <button type="submit">Atualizar</button>
    <a href="{{ url_for('index') }}">Cancelar</a>
</form>
{% endblock %}
